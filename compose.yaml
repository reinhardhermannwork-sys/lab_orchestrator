# Lab orchestrator (M8) and web frontend (M9) on the VPS (architecture doc §17).
#
#   cp deploy/.env.example deploy/.env   # then edit
#   docker compose --env-file deploy/.env up -d --build
#
# Neither service publishes a port. The orchestrator has no traefik
# labels: only containers on the shared lab network (the frontend) reach
# it. The frontend is reachable only through traefik + authentik.

name: lab-orchestrator

services:
  lab-orchestrator:
    build: .
    image: lab-orchestrator:${LAB_ORCH_IMAGE_TAG:-latest}
    restart: unless-stopped
    # SIGTERM lets the lifespan cancel provisioning tasks and close the
    # SSH connection; startup reconciliation cleans up what was in flight.
    stop_grace_period: 30s
    env_file:
      - deploy/.env
    environment:
      # Container-side paths, fixed to match the mounts below.
      LAB_ORCH_DB_PATH: /data/orchestrator.db
      LAB_ORCH_MACHINES_CONFIG_PATH: /etc/lab-orchestrator/machines.yaml
      LAB_ORCH_TUX2LAB_SSH_KEY_PATH: /run/secrets/lab-orchestrator/tux2lab_ssh_key
      LAB_ORCH_TUX2LAB_SSH_KNOWN_HOSTS_PATH: /run/secrets/lab-orchestrator/known_hosts
    volumes:
      - orchestrator-data:/data
      - ${LAB_ORCH_HOST_MACHINES_CONFIG:-./config/machines.yaml}:/etc/lab-orchestrator/machines.yaml:ro
      - ${LAB_ORCH_HOST_SECRETS_DIR:-./deploy/secrets}:/run/secrets/lab-orchestrator:ro
    extra_hosts:
      # The host's sshd, where the restricted tux2lab wrapper lives.
      - "host.docker.internal:host-gateway"
    networks:
      - lab

  lab-frontend:
    build: ./frontend
    image: lab-frontend:${LAB_ORCH_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      LAB_FRONTEND_ORCHESTRATOR_URL: http://lab-orchestrator:8000
      LAB_FRONTEND_USER_HEADER: ${LAB_FRONTEND_USER_HEADER:-X-authentik-username}
      # LAB_FRONTEND_DEV_USER is deliberately never set here: in a
      # deployment the identity must come from authentik via traefik.
    # No published port: the identity header is only trustworthy because
    # traefik (which overwrites it from authentik's response) is the only
    # way in.
    networks:
      - lab
    depends_on:
      - lab-orchestrator
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${LAB_NETWORK}
      traefik.http.routers.lab-frontend.rule: ${LAB_FRONTEND_ROUTER_RULE:?set LAB_FRONTEND_ROUTER_RULE in deploy/.env}
      traefik.http.routers.lab-frontend.entrypoints: ${TRAEFIK_ENTRYPOINT:?set TRAEFIK_ENTRYPOINT in deploy/.env}
      traefik.http.routers.lab-frontend.tls.certresolver: ${TRAEFIK_CERTRESOLVER:?set TRAEFIK_CERTRESOLVER in deploy/.env}
      traefik.http.routers.lab-frontend.middlewares: ${TRAEFIK_AUTH_MIDDLEWARE:?set TRAEFIK_AUTH_MIDDLEWARE in deploy/.env}
      traefik.http.services.lab-frontend.loadbalancer.server.port: "3000"

volumes:
  orchestrator-data:

networks:
  lab:
    external: true
    name: ${LAB_NETWORK:?set LAB_NETWORK to the shared container network in deploy/.env}
