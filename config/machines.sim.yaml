# Machine types of the simulation instance on the test VM (lab orchestrator
# M13, architecture doc §18): only the simulated Mercury MERCSC0000. Used by
# deploy/compose.sim.yaml (M13 SP4) via LAB_ORCH_MACHINES_CONFIG_PATH, and by
# tests/test_mercury_sim.py. The VPS instance keeps config/machines.yaml.
#
# The image is resolved on the host (mercury-lab docs/sim-host.md,
# mercury-images.conf): mercsc0000-v1.2 = mercury-reference v1.2,
# mercury-wine:w3-w11s3, msim:r9.

machines:
  mercsc0000:
    display_name: "Mercury MERCSC0000 (simulation)"
    code: "mrc"
    codename: "mercury"
    provider: "mercury-sim"
    image: "mercsc0000-v1.2"
    protocol: "vnc"
    probe_port: 5900  # VNC of the HMI
    lifetime_hours: 4
    enabled: true
